    ManifestResponse:
      type: object
      description: Manifest response structure
      properties:
        dispatchDate:
          type: string
          description: A string in the ISO 8601 calendar date extended format, e.g. 2019-08-13, representing the day on which the package is expected to depart your facility. The date must be today or later. It cannot be in the past. If the dispatch date is not included, the current timestamp will be used.
          optional: false
          format: date
        shipDate:
          type: string
          format: date
          description: A string in the ISO 8601 calendar date extended format, e.g. 2019-08-13, representing the day on which the package is expected to be tendered. The date must be today or greater. It cannot be in the past.
          optional: true
        tenderFacilityId:
          $ref: '#/components/schemas/FacilityId'
          optional: true
        packageIdsUpdated:
          type: array
          items:
            type: string
          description: An array of package IDs for packages that were updated with the new dispatch date
          optional: true
        packageIdsNotFound:
          type: array
          items:
            type: string
          description: An array of package IDs for packages that were not found within the system
          optional: true
        barcodesUpdated:
          type: array
          items:
            type: string
          description: An array of barcodes for packages that were updated with the new dispatch date
          optional: true
        barcodesNotFound:
          type: array
          items:
            type: string
          description: An array of barcodes for packages that were not found within the system
          optional: true
        trackingIdsUpdated:
          type: array
          items:
            type: string
          description: An array of tracking IDs for packages that were updated with the new dispatch date
          optional: true
        trackingIdsNotFound:
          type: array
          items:
            type: string
          description: An array of tracking IDs for packages that were not found within the system
          optional: true
        externalIdsUpdated:
          type: array
          items:
            type: string
          description: An array of external IDs for packages that were updated with the new dispatch date
          optional: true
        externalIdsNotFound:
          type: array
          items:
            type: string
          description: An array of external IDs for packages that were not found within the system
          optional: true
    ErrorResponse:
      description: Error response object
      type: object
      required:
      - message
      properties:
        message:
          description: Error description
          type: string
        errors:
          description: List of validation errors
          type: array
          items:
            type: object
            required:
            - code
            - message
            - path
            properties:
              code:
                description: Error code
                type: string
                enum:
                - invalid_type
                - unrecognized_keys
                - invalid_string
                - invalid_enum_value
                - invalid_date
                - too_small
                - too_big
                - invalid_packages
                - invalid_address_field
                - unserviceable_zip_code
                - invalid_merchant
                - invalid_external_client
                - missing_package_description
              message:
                type: string
                description: Error description
              path:
                description: Path to the invalid field in your input
                type: array
                items:
                  type:
                  - string
                  - number
              expected:
                type: string
                description: Expected type
              received:
                type: string
                description: Received type
              keys:
                description: List of unrecognized keys
                type: array
                items:
                  type: string
              options:
                description: Valid string values for the enum
                type: array
                items:
                  type: string
              minimum:
                type: number
                description: Minimum expected length/value
              maximum:
                type: number
                description: Maximum expected length/value
        error:
          description: Legacy error description (deprecated)
          deprecated: true
          oneOf:
          - type: object
            properties:
              code:
                type: integer
              error:
                type: string
          - type: string
    ManifestRequestWithPackageIds:
      type: object
      required:
      - packageIds
      properties:
        transitType:
          type: string
          default: truck
          description: The type of vehicle that the package has been loaded onto. Will default to 'truck'
          enum:
          - truck
          - plane
        dispatchDate:
          type: string
          description: A string in the ISO 8601 calendar date extended format, e.g. 2019-08-13, representing the day on which the package is expected to depart your facility. The date must be today or later. It cannot be in the past. If the dispatch date is not included, the current timestamp will be used.
          pattern: ^\d{4}-\d{2}-\d{2}$
          format: date
        packageIds:
          type: array
          description: An array of packages to be updated with new dispatchDates
          minItems: 1
          maxItems: 100
          items:
            type: string
        shipDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: A string in the ISO 8601 calendar date extended format, e.g. 2019-08-13, representing the day on which the package is expected to be tendered. The date must be today or greater. It cannot be in the past.
        tenderFacilityId:
