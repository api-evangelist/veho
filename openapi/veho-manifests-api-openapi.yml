openapi: 3.1.0
info:
  title: Veho labels manifests API
  version: '2.2'
  contact:
    email: info@shipveho.com
    url: https://shipveho.com/
    name: Veho
  description: 'Welcome to the Veho API documentation! You can use the Veho API to programmatically create shipments and download shipping labels.

    You''re viewing Version 2 of the Veho API, which is our current version, meaning it''s actively supported. Veho API V1 is deprecated.'
  summary: Veho API to programmatically create shipments and download shipping labels
servers:
- url: https://api.shipveho.com/v2
  description: Production
- url: https://api.sandbox.shipveho.com/v2
  description: Sandbox
security:
- apiKey: []
tags:
- name: manifests
  description: Manifests
paths:
  /manifests/notify:
    post:
      summary: Asynchronously submit packages set to be injected on a specific date
      description: The packages must exist already in our systems. The package identifiers can be package IDs, tracking IDs, external IDs or barcodes. The validation is asynchronous, thus the endpoint will respond a 201 status as soon as possible.
      tags:
      - manifests
      operationId: postManifestsAsync
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ManifestRequestWithPackageIds'
              - $ref: '#/components/schemas/ManifestRequestWithBarcodes'
              - $ref: '#/components/schemas/ManifestRequestWithExternalIds'
              - $ref: '#/components/schemas/ManifestRequestWithTrackingIds'
            examples:
              packageIds:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  packageIds:
                  - packageId1
                  - packageId2
              barcodes:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  barcodes:
                  - barcode1
                  - barcode2
              externalIds:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  externalIds:
                  - externalId1
                  - externalId2
              trackingIds:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  trackingIds:
                  - trackingId1
                  - trackingId2
        required: true
      responses:
        '201':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /manifests:
    post:
      summary: Synchronously post a list of packages to set their dispatch date
      description: The packages must exist already in our systems. The package identifiers can be package IDs, tracking IDs, external IDs or barcodes. The validation is synchronous, thus the endpoint will respond accordingly depending on the data provided.
      tags:
      - manifests
      operationId: postManifestsSync
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ManifestRequestWithPackageIds'
              - $ref: '#/components/schemas/ManifestRequestWithBarcodes'
              - $ref: '#/components/schemas/ManifestRequestWithExternalIds'
              - $ref: '#/components/schemas/ManifestRequestWithTrackingIds'
            examples:
              packageIds:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  packageIds:
                  - packageId1
                  - packageId2
              barcodes:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  barcodes:
                  - barcode1
                  - barcode2
              externalIds:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  externalIds:
                  - externalId1
                  - externalId2
              trackingIds:
                value:
                  transitType: truck
                  dispatchDate: '2025-01-01'
                  trackingIds:
                  - trackingId1
                  - trackingId2
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
