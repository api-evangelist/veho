    PackageResponse:
      additionalProperties: true
      title: Package Response
      type: object
      properties:
        _id:
          type: string
          description: Unique Package ID. Generated by Veho.
          readOnly: true
        orderId:
          type: string
          description: Id of the order this package belongs to.
          readOnly: true
        clientId:
          type: string
          description: Client ID
          readOnly: true
        pdfShippingLabelLink:
          type: string
          description: |
            Link to pdf shipping label file. Note that while the label link is immediately generated with the order, please account for an extra 100ms-5000ms after order creation for the label to be generated. Before that, this link may return a 404 error.
          readOnly: true
        pngShippingLabelLink:
          type: string
