          example: abcd1234
        createdAt:
          type: string
          format: date-time
          example: '2021-01-30T08:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2021-01-30T08:30:00Z'
        endpoint:
          description: The URL that Veho will send webhook events to for this configuration
          type: string
          format: url
          example: 'https://www.example.com'
        eventType:
          $ref: '#/components/schemas/EventType'
