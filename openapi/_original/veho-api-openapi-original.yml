    ErrorResponse:
      description: Error response object
      type: object
      required:
        - message
      properties:
        message:
          description: Error description
          type: string
        errors:
          description: List of validation errors
          type: array
          items:
            type: object
            required:
              - code
              - message
              - path
            properties:
              code:
                description: Error code
                type: string
                enum:
                  - invalid_type
                  - unrecognized_keys
                  - invalid_string
                  - invalid_enum_value
                  - invalid_date
                  - too_small
                  - too_big
                  - invalid_packages
                  - invalid_address_field
                  - unserviceable_zip_code
                  - invalid_merchant
                  - invalid_external_client
                  - missing_package_description
              message:
                type: string
                description: Error description
              path:
                description: Path to the invalid field in your input
                type: array
                items:
                  type:
                    - string
                    - number
              expected:
                type: string
                description: Expected type
              received:
                type: string
                description: Received type
              keys:
                description: List of unrecognized keys
                type: array
                items:
                  type: string
              options:
                description: Valid string values for the enum
                type: array
                items:
                  type: string
              minimum:
                type: number
                description: Minimum expected length/value
              maximum:
                type: number
                description: Maximum expected length/value
        error:
          description: Legacy error description (deprecated)
          deprecated: true
          oneOf:
            - type: object
              properties:
                code:
                  type: integer
                error:
                  type: string
            - type: string
