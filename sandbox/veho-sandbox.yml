modes:
  - name: production
    api_base: https://api.shipveho.com/v2
    tracker: https://track.shipveho.com/#/
    sftp: sftp.shipveho.com
  - name: sandbox
    api_base: https://api.sandbox.shipveho.com/v2
    tracker: https://track-sandbox.shipveho.com/#/
    sftp: sandbox.sftp.shipveho.com
    notes: >-
      Separate API URL and API key from production. Mimics production
      behaviors and responses without affecting live data or interacting
      with real systems.

separation: >-
  Sandbox is separated by host (append -sandbox or .sandbox to the subdomain)
  and by a distinct API key that Veho provides; there is no key-prefix
  convention documented.

