description: >-
  Veho provides a full sandbox environment that mimics the behaviors and
  responses of the production environment. Sandbox endpoints take the same
  form as production endpoints but append -sandbox or .sandbox to the
  subdomain, and use a separate sandbox API key issued by Veho. The sandbox
  contains a subset of serviceable ZIP codes, so orders must use a destination
  ZIP from the sandbox serviceable ZIP list.
