- name: apiKey
  type: apiKey
  in: header
  parameter: apikey
  provisioning: API keys are issued by Veho (sales/integration-led); separate key per environment
  errors:
    '401': missing or invalid apikey header
    '403': apikey lacks permission for the requested resource
