description: >-
  Veho publishes no first-party API client SDKs; the docs show raw curl and
  axios examples against api.shipveho.com/v2. The @veho-tech npm scope
  carries first-party open-source utility libraries (not API clients).
  Unscoped "veho" packages on PyPI/NuGet/crates.io are unrelated third-party
  iterable-toolset libraries. Integration is also available indirectly via
  EasyPost and ShipEngine carrier integrations.
