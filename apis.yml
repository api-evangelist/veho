aid: veho
name: Veho
description: >-
  Veho is a US last-mile delivery and returns carrier built for e-commerce
  brands, pairing a crowdsourced driver network with purpose-built logistics
  software. The Veho API (Version 2) is a REST/JSON API for shippers and 3PLs
  to create delivery orders, manage packages and shipping labels (PDF/PNG/ZPL),
  quote rates, check serviceable ZIP codes, manage merchants under a client
  account, and subscribe to 22 package milestone webhook event types, with a
  full sandbox environment and bulk manifest uploads over S3 or SFTP.
